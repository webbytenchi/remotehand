[package]
name = "remotehand"
version = "1.2.15"
description = "Portable remote workstation manager"
authors = ["RemoteHand contributors"]
license = "MIT"
repository = "https://github.com/webbytenchi/remotehand"
edition = "2021"
rust-version = "1.85"

[lib]
name = "remotehand_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tray-icon = { version = "0.24.2", default-features = false }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "=2.4.5"
tauri-plugin-global-shortcut = "2.3.2"
age = "=0.11.1"
rfd = "0.15"
russh = { version = "=0.62.2", default-features = false, features = ["ring"] }
russh-sftp = "=3.0.0"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time"] }
home = "=0.5.9"
ed25519-dalek = "=2.1.1"
async-trait = "0.1"
zeroize = "=1.9.0"
arboard = { version = "3.4", default-features = false }
getifaddrs = "0.6.2"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

portable-pty = "0.9.0"

[patch.crates-io]
# Temporary local backport of upstream tray-icon GUID support:
# https://github.com/tauri-apps/tray-icon/commit/95fc3cc10f56557c965fbc8a70b63b8b2a734245
tray-icon = { path = "vendor/tray-icon" }
