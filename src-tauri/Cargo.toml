[package]
name = "remotehand"
version = "1.2.1"
description = "Portable remote workstation manager"
authors = ["RemoteHand contributors"]
license = "MIT"
repository = "https://github.com/webbytenchi/remotehand"
edition = "2021"
rust-version = "1.85"

[lib]
name = "remotehand_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "=2.4.5"
age = "=0.11.1"
rfd = "0.15"
russh = { version = "=0.62.2", default-features = false, features = ["ring"] }
russh-sftp = "=3.0.0"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time"] }
home = "=0.5.9"
ed25519-dalek = "=2.1.1"
async-trait = "0.1"
zeroize = "=1.9.0"

portable-pty = "0.9.0"
