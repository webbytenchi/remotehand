[package]
name = "remotehand"
version = "0.1.0"
description = "Portable remote workstation manager"
authors = ["RemoteHand contributors"]
license = "MIT"
repository = "https://github.com/webbytenchi/remotehand"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "remotehand_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"

portable-pty = "0.9.0"
