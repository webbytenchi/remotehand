<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RemoteHand Panel</title>
    <link id="remotehand-popout-styles" rel="stylesheet" href="/src/popout.css" />
    <style>
      html {
        visibility: hidden;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--remotehand-popout-background, #07090d);
      }
    </style>
    <script>
      (() => {
        try {
          const saved = JSON.parse(localStorage.getItem("remotehand.settings") || "{}");
          const theme = saved.theme || localStorage.getItem("remotehand.theme") || "dark";
          const resolved =
            theme === "system"
              ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
              : theme;
          document.documentElement.style.setProperty(
            "--remotehand-popout-background",
            resolved === "light" ? "#eef1f4" : "#07090d",
          );
          document.documentElement.style.colorScheme = resolved;
        } catch {
          document.documentElement.style.setProperty("--remotehand-popout-background", "#07090d");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
  </head>
  <body></body>
</html>
